name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  check-readme:
    name: Check README version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify README mentions current tag version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if ! grep -q "$VERSION" README.md; then
            echo "::error::README.md does not mention version $VERSION. Please update README before tagging."
            exit 1
          fi

  build:
    needs: check-readme
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: todo-tui-aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: todo-tui-x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: todo-tui-x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tar.gz
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/todo-tui
          ARCHIVE=${{ matrix.artifact }}.tar.gz
          tar -czf "$ARCHIVE" -C "$(dirname $BIN)" "$(basename $BIN)"
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.ARCHIVE }}

  deb:
    name: Build .deb (Ubuntu x86_64)
    needs: check-readme
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: deb-x86_64

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        run: cargo deb --target x86_64-unknown-linux-gnu

      - name: Locate .deb
        run: |
          DEB=$(find target/x86_64-unknown-linux-gnu/debian -name "*.deb" | head -1)
          echo "DEB=$DEB" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: ${{ env.DEB }}

  release:
    name: Publish Release
    needs: [build, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.deb
          generate_release_notes: true

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Get version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Download macOS tarballs
        run: |
          curl -fsSL -o arm64.tar.gz \
            "https://github.com/PentiumRabbit/todo-tui/releases/download/${GITHUB_REF_NAME}/todo-tui-aarch64-apple-darwin.tar.gz"
          curl -fsSL -o x86_64.tar.gz \
            "https://github.com/PentiumRabbit/todo-tui/releases/download/${GITHUB_REF_NAME}/todo-tui-x86_64-apple-darwin.tar.gz"

      - name: Compute sha256
        run: |
          echo "SHA256_ARM64=$(sha256sum arm64.tar.gz | awk '{print $1}')" >> $GITHUB_ENV
          echo "SHA256_X86_64=$(sha256sum x86_64.tar.gz | awk '{print $1}')" >> $GITHUB_ENV

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: PentiumRabbit/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          python3 - <<'EOF'
          import os, textwrap
          v   = os.environ["VERSION"]
          a64 = os.environ["SHA256_ARM64"]
          x64 = os.environ["SHA256_X86_64"]
          formula = textwrap.dedent(f"""\
          class TodoTui < Formula
            desc "Keyboard-driven terminal todo manager built with Rust and ratatui"
            homepage "https://github.com/PentiumRabbit/todo-tui"
            version "{v}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/PentiumRabbit/todo-tui/releases/download/v{v}/todo-tui-aarch64-apple-darwin.tar.gz"
                sha256 "{a64}"
              else
                url "https://github.com/PentiumRabbit/todo-tui/releases/download/v{v}/todo-tui-x86_64-apple-darwin.tar.gz"
                sha256 "{x64}"
              end
            end

            def install
              bin.install "todo-tui"
            end

            test do
              assert_match version.to_s, shell_output("\#{{bin}}/todo-tui --version 2>&1", 1)
            end
          end
          """)
          with open("homebrew-tap/Formula/todo-tui.rb", "w") as f:
              f.write(formula)
          EOF

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/todo-tui.rb
          git commit -m "chore: update todo-tui to v${VERSION}"
          git push
