[package]
name = "todo-tui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "todo-tui"
path = "src/main.rs"

[dependencies]
ratatui = "^0.29"
crossterm = "^0.28"
rusqlite = { version = "^0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
dirs-next = "2"
unicode-width = "0.1"

[dev-dependencies]
tempfile = "3"
