[package]
name = "todo-tui"
version = "0.2.0"
edition = "2021"
description = "A keyboard-driven terminal todo manager"
license = "MIT"
homepage = "https://github.com/PentiumRabbit/todo-tui"
repository = "https://github.com/PentiumRabbit/todo-tui"

[package.metadata.deb]
maintainer = "PentiumRabbit"
copyright = "2026, PentiumRabbit"
license-file = ["LICENSE", "0"]
extended-description = "Keyboard-driven terminal todo manager built with Rust and ratatui. Supports tags, priorities, due dates, and SQLite persistence."
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/todo-tui", "usr/bin/", "755"],
]

[[bin]]
name = "todo-tui"
path = "src/main.rs"

[dependencies]
ratatui = "^0.29"
crossterm = "^0.28"
rusqlite = { version = "^0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
dirs-next = "2"
unicode-width = "0.1"

[dev-dependencies]
tempfile = "3"
